{#let md=cdi:metadata g=cdi:metadata.comments.giscus}
<script>
  'use strict';

  (function () {
    var commentContainer = document.querySelector('#giscus-comments');

    if (!commentContainer) {
      return;
    }

    var script = document.createElement('script');

    script.setAttribute('src', 'https://giscus.app/client.js');
    script.setAttribute('data-repo', '{md.repository}');
    script.setAttribute('data-repo-id', '{g.repo_id}');
    script.setAttribute('data-category', '{g.category_name}');
    script.setAttribute('data-category-id', '{g.category_id}');
    script.setAttribute('data-mapping', '{g.discussion_term ?: 'pathname'}');
    script.setAttribute('data-strict', '{g.strict ?: 0}');
    script.setAttribute('data-reactions-enabled', '{g.reactions_enabled ?: 1}');
    script.setAttribute('data-emit-metadata', '{g.emit_metadata ?: 0}');
    script.setAttribute('data-input-position', '{g.input_position ?: 'top'}');
    script.setAttribute('data-theme', '{g.theme ?: 'light'}');
    script.setAttribute('data-lang',  '{g.lang ?: 'en'}');
    script.setAttribute('crossorigin', 'anonymous');

    script.setAttribute('async', '');

    commentContainer.appendChild(script);
  })();
</script>
{/let}
