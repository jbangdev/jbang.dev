<!-- Modern Typography -->

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="{page.rel('/site.webmanifest')}">

<!-- Theme initialization (runs early to prevent flash of wrong theme) -->
<script>
(function() {
  var saved = localStorage.getItem('jb-theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- hilight -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" media="print" onload="this.media='all'" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" defer></script>
<script defer>document.addEventListener('DOMContentLoaded', function() { hljs.highlightAll(); });</script>

<!-- Global click-to-copy for pre/code blocks -->
<style>
pre, :not(pre) > code {
  cursor: pointer;
  position: relative;
}
pre:hover, :not(pre) > code:hover {
  opacity: 0.92;
}
pre::after {
  content: "Click to copy";
  position: absolute;
  right: 10px;
  top: 6px;
  font-size: 11px;
  font-family: var(--jb-font-sans, sans-serif);
  color: #94a3b8;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
pre:hover::after {
  opacity: 1;
}
.copy-toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  padding: 0.75rem 1.25rem;
  border-radius: 8px;
  background: #10b981;
  color: white;
  font-size: 0.88rem;
  font-weight: 500;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  animation: copy-toast-in 0.2s ease;
  display: none;
}
@keyframes copy-toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var toast = document.createElement('div');
  toast.className = 'copy-toast';
  document.body.appendChild(toast);
  var toastTimer;
  function showCopyToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.style.display = 'none'; }, 2500);
  }
  window.showCopyToast = showCopyToast;
  document.addEventListener('click', function(e) {
    var pre = e.target.closest('pre');
    var code = !pre ? e.target.closest('code') : null;
    var target = pre || code;
    if (!target || target.closest('.no-copy')) return;
    var text = target.textContent;
    navigator.clipboard.writeText(text).then(function() {
      showCopyToast('Copied: ' + text.trim().substring(0, 80) + (text.trim().length > 80 ? '…' : ''));
    });
  });

  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('jb-theme', next);
    });
  }
});
</script>
