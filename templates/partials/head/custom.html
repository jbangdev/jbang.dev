<!-- Theme initialization (runs early to prevent flash of wrong theme).
     Mode is 'auto' (follow OS, nothing stored), 'light' or 'dark' (stored in localStorage 'jb-theme'). -->
<script>
(function() {
  var mode = 'auto';
  try { mode = localStorage.getItem('jb-theme') || 'auto'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'auto';
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var root = document.documentElement;
  root.setAttribute('data-theme-mode', mode);
  root.setAttribute('data-theme', mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode);
})();
</script>

<!-- Global click-to-copy for pre/code blocks -->
<style>
pre, :not(pre) > code {
  cursor: pointer;
  position: relative;
}
pre:hover, :not(pre) > code:hover {
  opacity: 0.92;
}
pre::after {
  content: "Click to copy";
  position: absolute;
  right: 10px;
  top: 6px;
  font-size: 11px;
  font-family: var(--jb-font-sans, sans-serif);
  color: #94a3b8;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
pre:hover::after {
  opacity: 1;
}
.copy-toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  padding: 0.75rem 1.25rem;
  border-radius: 8px;
  background: #10b981;
  color: white;
  font-size: 0.88rem;
  font-weight: 500;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  animation: copy-toast-in 0.2s ease;
  display: none;
}
@keyframes copy-toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var toast = document.createElement('div');
  toast.className = 'copy-toast';
  document.body.appendChild(toast);
  var toastTimer;
  function showCopyToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.style.display = 'none'; }, 2500);
  }
  window.showCopyToast = showCopyToast;
  document.addEventListener('click', function(e) {
    var pre = e.target.closest('pre');
    var code = !pre ? e.target.closest('code') : null;
    var target = pre || code;
    if (!target || target.closest('.no-copy')) return;
    var text = target.textContent;
    navigator.clipboard.writeText(text).then(function() {
      showCopyToast('Copied: ' + text.trim().substring(0, 80) + (text.trim().length > 80 ? '…' : ''));
    });
  });

  // Theme toggle: Auto -> Light -> Dark -> Auto
  var toggle = document.getElementById('theme-toggle');
  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var labels = { auto: 'Auto (follows system)', light: 'Light', dark: 'Dark' };
  var nextMode = { auto: 'light', light: 'dark', dark: 'auto' };
  function applyTheme(mode) {
    root.setAttribute('data-theme-mode', mode);
    root.setAttribute('data-theme', mode === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : mode);
    if (toggle) {
      var label = 'Theme: ' + labels[mode] + '. Switch to ' + labels[nextMode[mode]];
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
    }
  }
  if (mq) {
    var onSystemChange = function() {
      if ((root.getAttribute('data-theme-mode') || 'auto') === 'auto') applyTheme('auto');
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange); else if (mq.addListener) mq.addListener(onSystemChange);
  }
  if (toggle) {
    applyTheme(root.getAttribute('data-theme-mode') || 'auto');
    toggle.addEventListener('click', function() {
      var mode = nextMode[root.getAttribute('data-theme-mode') || 'auto'];
      try {
        if (mode === 'auto') localStorage.removeItem('jb-theme'); else localStorage.setItem('jb-theme', mode);
      } catch (e) {}
      applyTheme(mode);
    });
  }
});
</script>
