name: Surge.sh Preview

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

defaults:
  run:
    shell: bash

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      # this is unfortunately needed to be able to write comments on pull requests
      pull-requests: write
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
    - name: Download PR Artifact
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        run-id: ${{ github.event.workflow_run.id }}
        name: site
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Store PR id and shaas variable
      id: pr
      run: |
        pr=$(<pr-id.txt)
        if ! [[ $pr =~ ^[0-9]+$ ]] ; then
          echo "PR id extracted from pr-id.txt is not a number: $pr"
          exit 1
        fi
        echo "id=${pr}" >> $GITHUB_OUTPUT
        rm -f pr-id.txt
        echo "sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
      env:
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    - name: Publishing to surge for preview
      id: deploy
      run: npx surge@0.23.1 ./ --domain https://jbangdev-preview-pr-${PR_ID}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      env:
        PR_ID: ${{  steps.pr.outputs.id }}

    - name: Update PR status comment on success
      run: |
        marker='<!-- Preview status comment marker -->'
        body="${BODY}"$'\n\n'"${marker}"
        id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_ID}/comments" \
          --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_ID}/comments" -f body="$body" >/dev/null
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_ID: ${{ steps.pr.outputs.id }}
        BODY: |
          🎊 PR Preview ${{ steps.pr.outputs.sha }} has been successfully built and deployed to https://jbangdev-preview-pr-${{ steps.pr.outputs.id }}.surge.sh
    - name: Update PR status comment on failure
      if: ${{ failure() && steps.pr.outputs.id != '' }}
      run: |
        marker='<!-- Preview status comment marker -->'
        body="${BODY}"$'\n\n'"${marker}"
        id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_ID}/comments" \
          --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_ID}/comments" -f body="$body" >/dev/null
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_ID: ${{ steps.pr.outputs.id }}
        BODY: |
          😭 Deploy PR Preview failed.
          <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
