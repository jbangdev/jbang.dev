name: Surge.sh Preview Teardown

on:
  pull_request_target:
    types: [closed]

jobs:
  preview-teardown:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Teardown surge preview
        id: deploy
        run: npx surge teardown https://jbangdev-preview-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }} || echo "NOT_TORNDOWN=true" >> "$GITHUB_ENV"
      - name: Update PR status comment
        if: env.NOT_TORNDOWN != 'true'
        run: |
          marker='<!-- Preview status comment marker -->'
          body="${BODY}"$'\n\n'"${marker}"
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_ID}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_ID}/comments" -f body="$body" >/dev/null
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_ID: ${{ github.event.number }}
          BODY: |
            🙈 The PR is closed and the preview is expired.
