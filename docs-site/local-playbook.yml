site:
  title: JBang
  url: /documentation
  start_page: jbang-all::index.adoc

asciidoc:
  attributes:
    page-pagination: ''
    source-highlighter: shiki

content:
  sources:
    - url: ../../jbang.dev
      branches: HEAD
      start_path: docs-site
    - url: ../../jbang
      branches: HEAD
      start_path: docs
    - url: ../../jbang-idea
      branches: HEAD
      start_path: docs
    - url: ../../jbang-vscode
      branches: HEAD
      start_path: docs
    - url: ../../jbang-maven-plugin
      branches: HEAD
      start_path: docs
    - url: ../../jbang-gradle-plugin
      branches: HEAD
      start_path: docs

antora:
  extensions:
    - require: '@antora/collector-extension'
    - require: 'antora-shiki-extension'
      light_theme: "light-plus"
      dark_theme: "dark-plus"
      languages:
        - bat
        - docker
        - fish
        - groovy
        - ini
        - java
        - javascript
        - json
        - kotlin
        - markdown
        - powershell
        - properties
        - python
        - shellscript
        - xml
        - yaml

ui:
  bundle:
    # Pinned release: Antora caches bundles by URL, so bumping the version is what
    # makes local builds pick up a new UI (a "latest" URL stays cached forever).
    url: https://github.com/jbangdev/jbang-antora-ui/releases/download/v0.0.9/ui-bundle.zip
